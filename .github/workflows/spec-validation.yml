name: History purge fixtures

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-purge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_history_purge_*.py' -v
