name: Invite-link fixtures
on:
  pull_request:
    paths:
      - 'app-components/**'
      - 'foundation/**'
      - 'transports/**'
      - 'features/**'
      - 'ideas/group-invite-links*'
      - 'ideas/group-invite-links/**'
      - 'layout.md'
      - 'tests/**'
      - '.github/workflows/invite-link-fixtures.yml'
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tests/ci-requirements.txt
      - run: python -c "import cryptography; print(cryptography.__version__)"
      - run: python -m unittest discover -s tests -v
