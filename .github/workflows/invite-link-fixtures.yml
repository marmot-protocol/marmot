name: Invite-link fixtures
on:
  pull_request:
    paths:
      - 'app-components/**'
      - 'foundation/**'
      - 'transports/**'
      - 'features/**'
      - 'ideas/group-invite-links*'
      - 'ideas/group-invite-links/**'
      - 'layout.md'
      - 'tests/**'
      - '.github/workflows/invite-link-fixtures.yml'
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.0
      - run: python -m unittest discover -s tests -v
