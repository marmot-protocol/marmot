<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Scene 1: Alice shares an invite</title>
<desc id="desc">Alice turns on invite links for Book club, picks approval, and gets a short wn.fo link, a QR code, and the long code.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.bg{fill:#f6f8fa}
.t{fill:#1f2328} .m{fill:#59636e} .a{fill:#0969da} .d{fill:#cf222e}
.g{fill:#1a7f37} .y{fill:#9a6700} .r{fill:#8250df} .f{fill:#afb8c1}
.frame{fill:#2d333b;stroke:#2d333b} .scr{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d1d9e0} .cardf{fill:#ffffff;stroke:#d1d9e0}
.ln{fill:none;stroke:#d1d9e0} .lnf{fill:#d1d9e0}
.btn{fill:#0969da} .btn2{fill:#ffffff;stroke:#d1d9e0} .btnd{fill:#ffffff;stroke:#cf222e}
.ta{fill:#ddf4ff} .td{fill:#ffebe9} .tg{fill:#dafbe1} .ty{fill:#fff8c5} .tr{fill:#fbefff}
.sa{stroke:#0969da} .sd{stroke:#cf222e} .sg{stroke:#1a7f37} .sy{stroke:#9a6700}
.sr{stroke:#8250df} .sm{stroke:#59636e} .sf{stroke:#afb8c1} .sl{stroke:#d1d9e0}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#ddf4ff;stroke:#0969da;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#afb8c1;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){
.bg{fill:#151b23}
.t{fill:#e6edf3} .m{fill:#9198a1} .a{fill:#4493f8} .d{fill:#f85149}
.g{fill:#3fb950} .y{fill:#d29922} .r{fill:#ab7df8} .f{fill:#484f58}
.frame{fill:#2f3742;stroke:#4a535e} .scr{fill:#0d1117}
.card{fill:#151b23;stroke:#3d444d} .cardf{fill:#0d1117;stroke:#3d444d}
.ln{fill:none;stroke:#3d444d} .lnf{fill:#3d444d}
.btn{fill:#1f6feb} .btn2{fill:#0d1117;stroke:#3d444d} .btnd{fill:#0d1117;stroke:#f85149}
.ta{fill:#12294a} .td{fill:#3c1618} .tg{fill:#12261e} .ty{fill:#2e2610} .tr{fill:#2a1d45}
.sa{stroke:#4493f8} .sd{stroke:#f85149} .sg{stroke:#3fb950} .sy{stroke:#d29922}
.sr{stroke:#ab7df8} .sm{stroke:#9198a1} .sf{stroke:#484f58} .sl{stroke:#3d444d}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#12294a;stroke:#4493f8;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#484f58;stroke-dasharray:6 4}
}
</style>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker>
<marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g"/></marker>
<marker id="hy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="y"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="560" rx="16"/>
<g transform="translate(70,36)">
<rect x="0" y="0" width="230" height="448" rx="32" class="frame" stroke-width="1.5"/>
<rect x="10" y="10" width="210" height="428" rx="24" class="scr"/>
<rect x="85" y="18" width="60" height="14" rx="7" class="frame"/>
<g transform="translate(10,10)">

<text x="16" y="52" class="t" font-size="18" font-weight="700">Invite links</text>
<text x="16" y="74" class="m" font-size="12">Book club</text>
<text x="16" y="108" class="t" font-size="13" font-weight="700">When someone asks</text>
<rect x="16" y="120" width="178" height="32" rx="16" class="btn"/>
<text x="105" y="140" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">Approve requests</text>
<rect x="16" y="160" width="178" height="32" rx="16" class="btn2"/>
<text x="105" y="180" class="t" font-size="12" font-weight="600" text-anchor="middle">Add automatically</text>
<text x="16" y="220" class="t" font-size="13" font-weight="700">Link works until</text>
<rect x="16" y="232" width="178" height="36" rx="8" class="card"/>
<text x="28" y="255" class="t" font-size="13">7 days</text>
<text x="16" y="300" class="m" font-size="12">You can make another link</text>
<text x="16" y="318" class="m" font-size="12">later, with its own expiry.</text>

</g>
</g>
<text x="185" y="508" class="m" font-size="13" font-weight="600" text-anchor="middle">Alice sets the link</text>
<g transform="translate(500,36)">
<rect x="0" y="0" width="230" height="448" rx="32" class="frame" stroke-width="1.5"/>
<rect x="10" y="10" width="210" height="428" rx="24" class="scr"/>
<rect x="85" y="18" width="60" height="14" rx="7" class="frame"/>
<g transform="translate(10,10)">

<text x="16" y="52" class="t" font-size="18" font-weight="700">Share</text>
<text x="16" y="74" class="m" font-size="12">Same invitation, three ways</text>
<rect x="16" y="92" width="178" height="44" rx="8" class="ta"/>
<text x="105" y="112" class="m" font-size="11" text-anchor="middle">Optional short link</text>
<text x="105" y="128" class="m" font-size="13" text-anchor="middle">Not created yet</text>
<rect x="16" y="148" width="178" height="32" rx="16" class="btn"/>
<text x="105" y="168" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">Copy complete code</text>
<rect x="16" y="190" width="178" height="32" rx="16" class="btn2"/>
<text x="105" y="210" class="t" font-size="12" font-weight="600" text-anchor="middle">Show QR code</text>
<rect x="16" y="232" width="178" height="32" rx="16" class="btn2"/>
<text x="105" y="252" class="t" font-size="12" font-weight="600" text-anchor="middle">Create optional short link</text>
<text x="16" y="292" class="m" font-size="11.5">Complete code or fitting QR first.</text>
<text x="16" y="310" class="m" font-size="11.5">Short link needs disclosure consent.</text>
<text x="16" y="336" class="m" font-size="11.5">Host can read invitation secrets.</text>

</g>
</g>
<text x="615" y="508" class="m" font-size="13" font-weight="600" text-anchor="middle">Then she shares it</text>
<path d="M312,250 H488" class="arr sa" marker-end="url(#ha)"/>
<text x="400" y="238" class="a" font-size="12" font-weight="600" text-anchor="middle">creates</text>
<text x="480" y="540" class="m" font-size="13" text-anchor="middle">The sample short id k3m9qx2a has eight characters. It locates the complete code at the chosen host.</text>

</svg>
