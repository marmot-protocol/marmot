<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker>
<marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g"/></marker>
<marker id="hy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="y"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="600" rx="16"/>
<rect x="330" y="16" width="300" height="36" rx="18" class="cardf"/>
<text x="480" y="39" class="a mono" font-size="15" font-weight="700" text-anchor="middle">wn.fo/k3m9qx2a</text>
<g transform="translate(70,70)">
<rect x="0" y="0" width="230" height="448" rx="32" class="frame" stroke-width="1.5"/>
<rect x="10" y="10" width="210" height="428" rx="24" class="scr"/>
<rect x="85" y="18" width="60" height="14" rx="7" class="frame"/>
<g transform="translate(10,10)">

<text x="16" y="52" class="m" font-size="11" text-anchor="start">wn.fo</text>
<text x="16" y="92" class="t" font-size="18" font-weight="700">Get Marmot</text>
<text x="16" y="122" class="t" font-size="13">Someone sent you an invite.</text>
<text x="16" y="146" class="t" font-size="13">Install the app, then open</text>
<text x="16" y="166" class="t" font-size="13">this link again.</text>
<rect x="16" y="196" width="178" height="36" rx="18" class="btn"/>
<text x="105" y="218" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">App Store</text>
<rect x="16" y="244" width="178" height="36" rx="18" class="btn2"/>
<text x="105" y="266" class="t" font-size="13" font-weight="600" text-anchor="middle">Google Play</text>
<text x="16" y="310" class="m" font-size="12">After it's installed, open</text>
<text x="16" y="328" class="m" font-size="12">this same link.</text>

</g>
</g>
<text x="185" y="542" class="m" font-size="13" font-weight="600" text-anchor="middle">No app installed</text>
<g transform="translate(560,70)">
<rect x="0" y="0" width="230" height="448" rx="32" class="frame" stroke-width="1.5"/>
<rect x="10" y="10" width="210" height="428" rx="24" class="scr"/>
<rect x="85" y="18" width="60" height="14" rx="7" class="frame"/>
<g transform="translate(10,10)">

<text x="16" y="48" class="m" font-size="11">Invite</text>
<circle cx="36" cy="86" r="18" class="ta"/>
<text x="36" y="92" class="a" font-size="16" font-weight="700" text-anchor="middle">B</text>
<text x="64" y="82" class="t" font-size="16" font-weight="700">Book club</text>
<text x="64" y="100" class="m" font-size="12">Group preview</text>
<text x="16" y="140" class="t" font-size="13">Thursday nights. Bring</text>
<text x="16" y="158" class="t" font-size="13">whatever you're reading.</text>
<rect x="16" y="180" width="178" height="56" rx="8" class="ty"/>
<text x="28" y="202" class="y" font-size="12" font-weight="700">Preview unconfirmed</text>
<text x="28" y="220" class="y" font-size="11.5">Checked when you're invited.</text>
<rect x="16" y="256" width="178" height="36" rx="18" class="btn"/>
<text x="105" y="278" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Join</text>
<text x="16" y="316" class="m" font-size="12">Nothing is sent until Join.</text>

</g>
</g>
<text x="675" y="542" class="m" font-size="13" font-weight="600" text-anchor="middle">App installed</text>
<path d="M430,52 V64 H185 V70" class="arr sa" marker-end="url(#ha)"/>
<path d="M530,52 V64 H675 V70" class="arr sa" marker-end="url(#ha)"/>
<text x="480" y="584" class="m" font-size="13" text-anchor="middle">With the app, the phone opens Marmot and passes in the Bech32m. Without it, the page only explains how to download.</text>

</svg>
