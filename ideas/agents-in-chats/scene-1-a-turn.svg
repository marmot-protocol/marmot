<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">Scene 1: one turn, as it appears in the chat and as it travels</title>
<desc id="desc">Alice&#x27;s phone shows her message, a turn row, a command row and the agent&#x27;s reply. Her message and the agent&#x27;s reply travel as ordinary chat messages. The turn and the command travel as agent items, each sent when it started and edited when it finished.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.bg{fill:#f6f8fa}
.t{fill:#1f2328} .m{fill:#59636e} .a{fill:#0969da} .d{fill:#cf222e}
.g{fill:#1a7f37} .y{fill:#9a6700} .r{fill:#8250df} .f{fill:#afb8c1}
.frame{fill:#2d333b;stroke:#2d333b} .scr{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d1d9e0} .cardf{fill:#ffffff;stroke:#d1d9e0}
.ln{fill:none;stroke:#d1d9e0} .lnf{fill:#d1d9e0}
.btn{fill:#0969da} .btn2{fill:#ffffff;stroke:#d1d9e0} .btnd{fill:#ffffff;stroke:#cf222e}
.ta{fill:#ddf4ff} .td{fill:#ffebe9} .tg{fill:#dafbe1} .ty{fill:#fff8c5} .tr{fill:#fbefff}
.sa{stroke:#0969da} .sd{stroke:#cf222e} .sg{stroke:#1a7f37} .sy{stroke:#9a6700}
.sr{stroke:#8250df} .sm{stroke:#59636e} .sf{stroke:#afb8c1} .sl{stroke:#d1d9e0}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#ddf4ff;stroke:#0969da;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#afb8c1;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){
.bg{fill:#151b23}
.t{fill:#e6edf3} .m{fill:#9198a1} .a{fill:#4493f8} .d{fill:#f85149}
.g{fill:#3fb950} .y{fill:#d29922} .r{fill:#ab7df8} .f{fill:#484f58}
.frame{fill:#2f3742;stroke:#4a535e} .scr{fill:#0d1117}
.card{fill:#151b23;stroke:#3d444d} .cardf{fill:#0d1117;stroke:#3d444d}
.ln{fill:none;stroke:#3d444d} .lnf{fill:#3d444d}
.btn{fill:#1f6feb} .btn2{fill:#0d1117;stroke:#3d444d} .btnd{fill:#0d1117;stroke:#f85149}
.ta{fill:#12294a} .td{fill:#3c1618} .tg{fill:#12261e} .ty{fill:#2e2610} .tr{fill:#2a1d45}
.sa{stroke:#4493f8} .sd{stroke:#f85149} .sg{stroke:#3fb950} .sy{stroke:#d29922}
.sr{stroke:#ab7df8} .sm{stroke:#9198a1} .sf{stroke:#484f58} .sl{stroke:#3d444d}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#12294a;stroke:#4493f8;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#484f58;stroke-dasharray:6 4}
}
</style>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker>
<marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="r"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g"/></marker>
<marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="470" rx="16"/>
<g transform="translate(50,30)"><rect x="0" y="0" width="250" height="410" rx="30" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="230" height="390" rx="22" class="scr"/><rect x="97.0" y="17" width="56" height="12" rx="6" class="frame"/><g transform="translate(10,10)"><text x="14" y="48" class="t" font-size="14" font-weight="700">Claude on the laptop</text><text x="14" y="63" class="m" font-size="10.5">an agent · 2 members</text><line x1="0" x2="230" y1="72" y2="72" class="sl" stroke-width="1"/><rect x="88" y="84" width="130" height="29" rx="11" class="ta"/><text x="98" y="103" class="t" font-size="11.5">run the tests</text><rect x="12" y="126" width="206" height="40" rx="7" class="cardf"/><rect x="12" y="126" width="4" height="40" rx="2" class="btn"/><text x="25" y="143" class="t" font-size="11" font-weight="600">Finished</text><text x="25" y="158" class="m" font-size="10">ran 1 command · 12 s</text><rect x="12" y="174" width="206" height="40" rx="7" class="cardf"/><rect x="12" y="174" width="4" height="40" rx="2" class="g"/><text x="25" y="191" class="t" font-size="11" font-weight="600">Ran a command</text><text x="25" y="206" class="m mono" font-size="10">cargo test · exit 0</text><rect x="12" y="224" width="150" height="29" rx="11" class="card"/><text x="22" y="243" class="t" font-size="11.5">All 42 tests pass.</text></g></g><text x="360" y="62" class="t" font-size="14" font-weight="700">What travelled through the group</text><rect x="360" y="84" width="300" height="70" rx="10" class="ta"/><text x="374" y="106" class="t" font-size="12.5" font-weight="700">Chat message, from Alice</text><text x="374" y="125" class="m" font-size="11">an ordinary message</text><path d="M306,138 C320,138 320,119 354,119" class="arr sf" marker-end="url(#hf)"/><rect x="360" y="164" width="300" height="70" rx="10" class="cardf"/><text x="374" y="186" class="t" font-size="12.5" font-weight="700">Agent item: turn</text><text x="374" y="205" class="m" font-size="11">sent when the turn started,</text><text x="374" y="221" class="m" font-size="11">edited when it finished</text><path d="M306,186 C320,186 320,199 354,199" class="arr sf" marker-end="url(#hf)"/><rect x="360" y="250" width="300" height="70" rx="10" class="cardf"/><text x="374" y="272" class="t" font-size="12.5" font-weight="700">Agent item: tool</text><text x="374" y="291" class="m" font-size="11">sent when the command started,</text><text x="374" y="307" class="m" font-size="11">edited when it finished</text><path d="M306,234 C320,234 320,285 354,285" class="arr sf" marker-end="url(#hf)"/><rect x="360" y="336" width="300" height="70" rx="10" class="ta"/><text x="374" y="358" class="t" font-size="12.5" font-weight="700">Chat message, from the agent</text><text x="374" y="377" class="m" font-size="11">an ordinary message,</text><text x="374" y="393" class="m" font-size="11">marked with the turn it belongs to</text><path d="M306,278 C320,278 320,371 354,371" class="arr sf" marker-end="url(#hf)"/><rect x="700" y="84" width="220" height="322" rx="10" class="card"/><text x="716" y="108" class="t" font-size="12.5" font-weight="700">Why two kinds of thing</text><text x="716" y="130" class="m" font-size="11.5">What the agent says is a chat</text><text x="716" y="147" class="m" font-size="11.5">message, so every Marmot client</text><text x="716" y="164" class="m" font-size="11.5">shows it, and replies, reactions,</text><text x="716" y="181" class="m" font-size="11.5">search and alerts just work.</text><text x="716" y="198" class="m" font-size="11.5"></text><text x="716" y="215" class="m" font-size="11.5">What the agent does is an agent</text><text x="716" y="232" class="m" font-size="11.5">item. A client that knows about</text><text x="716" y="249" class="m" font-size="11.5">agents draws it as a row that</text><text x="716" y="266" class="m" font-size="11.5">updates. Other clients can show</text><text x="716" y="283" class="m" font-size="11.5">its plain text, or nothing.</text>
</svg>
