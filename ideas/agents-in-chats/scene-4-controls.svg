<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">Scene 4: controlling the agent</title>
<desc id="desc">The app shows a session sheet with the model, the reasoning effort and the permission mode, an Interrupt button, a New session button and the harness&#x27;s slash commands. It draws these from a session item the agent sent. Changing the model sends a control, and the agent answers by editing the session item.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.bg{fill:#f6f8fa}
.t{fill:#1f2328} .m{fill:#59636e} .a{fill:#0969da} .d{fill:#cf222e}
.g{fill:#1a7f37} .y{fill:#9a6700} .r{fill:#8250df} .f{fill:#afb8c1}
.frame{fill:#2d333b;stroke:#2d333b} .scr{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d1d9e0} .cardf{fill:#ffffff;stroke:#d1d9e0}
.ln{fill:none;stroke:#d1d9e0} .lnf{fill:#d1d9e0}
.btn{fill:#0969da} .btn2{fill:#ffffff;stroke:#d1d9e0} .btnd{fill:#ffffff;stroke:#cf222e}
.ta{fill:#ddf4ff} .td{fill:#ffebe9} .tg{fill:#dafbe1} .ty{fill:#fff8c5} .tr{fill:#fbefff}
.sa{stroke:#0969da} .sd{stroke:#cf222e} .sg{stroke:#1a7f37} .sy{stroke:#9a6700}
.sr{stroke:#8250df} .sm{stroke:#59636e} .sf{stroke:#afb8c1} .sl{stroke:#d1d9e0}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#ddf4ff;stroke:#0969da;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#afb8c1;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){
.bg{fill:#151b23}
.t{fill:#e6edf3} .m{fill:#9198a1} .a{fill:#4493f8} .d{fill:#f85149}
.g{fill:#3fb950} .y{fill:#d29922} .r{fill:#ab7df8} .f{fill:#484f58}
.frame{fill:#2f3742;stroke:#4a535e} .scr{fill:#0d1117}
.card{fill:#151b23;stroke:#3d444d} .cardf{fill:#0d1117;stroke:#3d444d}
.ln{fill:none;stroke:#3d444d} .lnf{fill:#3d444d}
.btn{fill:#1f6feb} .btn2{fill:#0d1117;stroke:#3d444d} .btnd{fill:#0d1117;stroke:#f85149}
.ta{fill:#12294a} .td{fill:#3c1618} .tg{fill:#12261e} .ty{fill:#2e2610} .tr{fill:#2a1d45}
.sa{stroke:#4493f8} .sd{stroke:#f85149} .sg{stroke:#3fb950} .sy{stroke:#d29922}
.sr{stroke:#ab7df8} .sm{stroke:#9198a1} .sf{stroke:#484f58} .sl{stroke:#3d444d}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#12294a;stroke:#4493f8;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#484f58;stroke-dasharray:6 4}
}
</style>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker>
<marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="r"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g"/></marker>
<marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="440" rx="16"/>
<text x="50" y="46" class="t" font-size="14" font-weight="700">What the app draws</text><g transform="translate(50,58)"><rect x="0" y="0" width="250" height="350" rx="30" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="230" height="330" rx="22" class="scr"/><rect x="97.0" y="17" width="56" height="12" rx="6" class="frame"/><g transform="translate(10,10)"><text x="14" y="48" class="t" font-size="14" font-weight="700">Session</text><text x="14" y="63" class="m" font-size="10.5">Claude on the laptop</text><line x1="0" x2="230" y1="72" y2="72" class="sl" stroke-width="1"/><rect x="12" y="84" width="206" height="40" rx="8" class="cardf"/><text x="24" y="101" class="m" font-size="10.5">Model</text><text x="24" y="116" class="t" font-size="12" font-weight="600">sonnet</text><text x="206" y="110" class="m" font-size="12" text-anchor="end">▾</text><rect x="12" y="132" width="206" height="40" rx="8" class="cardf"/><text x="24" y="149" class="m" font-size="10.5">Reasoning effort</text><text x="24" y="164" class="t" font-size="12" font-weight="600">low</text><text x="206" y="158" class="m" font-size="12" text-anchor="end">▾</text><rect x="12" y="180" width="206" height="40" rx="8" class="cardf"/><text x="24" y="197" class="m" font-size="10.5">Permission mode</text><text x="24" y="212" class="t" font-size="12" font-weight="600">ask first</text><text x="206" y="206" class="m" font-size="12" text-anchor="end">▾</text><rect x="104" y="199" width="84" height="16" rx="8" class="ty"/><text x="146" y="211" class="y" font-size="9" font-weight="600" text-anchor="middle">needs approve</text><rect x="12" y="234" width="98" height="30" rx="15" class="btnd"/><text x="61" y="253" class="d" font-size="11" font-weight="600" text-anchor="middle">Interrupt</text><rect x="120" y="234" width="98" height="30" rx="15" class="btn2"/><text x="169" y="253" class="t" font-size="11" font-weight="600" text-anchor="middle">New session</text><text x="14" y="290" class="m" font-size="10.5">Slash commands</text><text x="14" y="308" class="t mono" font-size="10.5">/compact  /context  /review …</text></g></g><text x="600" y="46" class="t" font-size="14" font-weight="700">The session item, sent by the agent</text><rect x="600" y="62" width="310" height="132" rx="10" class="cardf"/><text x="614" y="84" class="t" font-size="12.5" font-weight="700">Session</text><text x="614" y="103" class="m" font-size="11">• settings: each with its value, the values</text><text x="614" y="119" class="m" font-size="11">   it accepts, and whether changing it</text><text x="614" y="135" class="m" font-size="11">   needs the right to approve</text><text x="614" y="151" class="m" font-size="11">• the harness&#x27;s own actions</text><text x="614" y="167" class="m" font-size="11">• its slash commands</text><line x1="592" y1="120" x2="312" y2="120" class="arr sf" marker-end="url(#hf)"/><text x="452" y="108" class="m" font-size="11" text-anchor="middle">the app draws its controls from it</text><rect x="600" y="240" width="310" height="132" rx="10" class="ta"/><text x="614" y="262" class="t" font-size="12.5" font-weight="700">Three shared controls</text><text x="614" y="281" class="m" font-size="11">interrupt · new session · set</text><text x="614" y="297" class="m" font-size="11"></text><text x="614" y="313" class="m" font-size="11">They mean the same for every harness.</text><text x="614" y="329" class="m" font-size="11">Everything else is whatever this harness</text><text x="614" y="345" class="m" font-size="11">offers: no shared list of models or modes.</text><line x1="312" y1="262" x2="592" y2="262" class="arr sa" marker-end="url(#ha)"/><text x="452" y="250" class="a" font-size="11" font-weight="600" text-anchor="middle">a control: set the model</text><line x1="592" y1="320" x2="312" y2="320" class="arr sg" marker-end="url(#hg)"/><text x="452" y="308" class="g" font-size="11" font-weight="600" text-anchor="middle">an edit of the session item</text>
</svg>
