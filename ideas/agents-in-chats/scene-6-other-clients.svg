<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">Scene 6: the same turn in three clients</title>
<desc id="desc">Three phones show the same turn. An app that knows about agents shows the turn and the command as rows that updated. An app on today&#x27;s library shows each item once in its first state. A client that hides unknown kinds shows only Alice&#x27;s message and the agent&#x27;s reply.</desc>
