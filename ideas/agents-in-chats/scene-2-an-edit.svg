<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
<title id="title">Scene 2: an item is updated with an edit</title>
<desc id="desc">The agent sends an agent item saying a command is running, then an edit that points at it and says the command finished. The chat shows one row that changed in place.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.bg{fill:#f6f8fa}
.t{fill:#1f2328} .m{fill:#59636e} .a{fill:#0969da} .d{fill:#cf222e}
.g{fill:#1a7f37} .y{fill:#9a6700} .r{fill:#8250df} .f{fill:#afb8c1}
.frame{fill:#2d333b;stroke:#2d333b} .scr{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d1d9e0} .cardf{fill:#ffffff;stroke:#d1d9e0}
.ln{fill:none;stroke:#d1d9e0} .lnf{fill:#d1d9e0}
.btn{fill:#0969da} .btn2{fill:#ffffff;stroke:#d1d9e0} .btnd{fill:#ffffff;stroke:#cf222e}
.ta{fill:#ddf4ff} .td{fill:#ffebe9} .tg{fill:#dafbe1} .ty{fill:#fff8c5} .tr{fill:#fbefff}
.sa{stroke:#0969da} .sd{stroke:#cf222e} .sg{stroke:#1a7f37} .sy{stroke:#9a6700}
.sr{stroke:#8250df} .sm{stroke:#59636e} .sf{stroke:#afb8c1} .sl{stroke:#d1d9e0}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#ddf4ff;stroke:#0969da;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#afb8c1;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){
.bg{fill:#151b23}
.t{fill:#e6edf3} .m{fill:#9198a1} .a{fill:#4493f8} .d{fill:#f85149}
.g{fill:#3fb950} .y{fill:#d29922} .r{fill:#ab7df8} .f{fill:#484f58}
.frame{fill:#2f3742;stroke:#4a535e} .scr{fill:#0d1117}
.card{fill:#151b23;stroke:#3d444d} .cardf{fill:#0d1117;stroke:#3d444d}
.ln{fill:none;stroke:#3d444d} .lnf{fill:#3d444d}
.btn{fill:#1f6feb} .btn2{fill:#0d1117;stroke:#3d444d} .btnd{fill:#0d1117;stroke:#f85149}
.ta{fill:#12294a} .td{fill:#3c1618} .tg{fill:#12261e} .ty{fill:#2e2610} .tr{fill:#2a1d45}
.sa{stroke:#4493f8} .sd{stroke:#f85149} .sg{stroke:#3fb950} .sy{stroke:#d29922}
.sr{stroke:#ab7df8} .sm{stroke:#9198a1} .sf{stroke:#484f58} .sl{stroke:#3d444d}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#12294a;stroke:#4493f8;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#484f58;stroke-dasharray:6 4}
}
</style>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker>
<marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="r"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g"/></marker>
<marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="400" rx="16"/>
<text x="50" y="52" class="t" font-size="14" font-weight="700">What the agent sends</text><rect x="50" y="70" width="330" height="78" rx="10" class="cardf"/><text x="64" y="92" class="t" font-size="12.5" font-weight="700">Agent item (the first event)</text><text x="64" y="111" class="m" font-size="11">tool · running</text><text x="64" y="127" class="t mono" font-size="11">Running a command: cargo test</text><rect x="50" y="178" width="330" height="78" rx="10" class="ta"/><text x="64" y="200" class="t" font-size="12.5" font-weight="700">Edit of that item, version 2</text><text x="64" y="219" class="m" font-size="11">tool · done</text><text x="64" y="235" class="t mono" font-size="11">Ran a command: cargo test (exit 0)</text><text x="50" y="290" class="m" font-size="11.5">The edit carries the whole item again, so a client</text><text x="50" y="307" class="m" font-size="11.5">that missed an earlier edit loses nothing.</text><text x="50" y="334" class="m" font-size="11.5">The version number orders edits. A timestamp in</text><text x="50" y="351" class="m" font-size="11.5">whole seconds cannot: a tool can start and finish</text><text x="50" y="368" class="m" font-size="11.5">within one second.</text><path d="M392,217 C430,217 430,109 392,109" class="arr sa" marker-end="url(#ha)"/><text x="436" y="167" class="a" font-size="11">points at</text><text x="560" y="52" class="t" font-size="14" font-weight="700">What the chat shows</text><g transform="translate(560,66)"><rect x="0" y="0" width="250" height="300" rx="30" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="230" height="280" rx="22" class="scr"/><rect x="97.0" y="17" width="56" height="12" rx="6" class="frame"/><g transform="translate(10,10)"><text x="14" y="48" class="t" font-size="14" font-weight="700">Claude on the laptop</text><text x="14" y="63" class="m" font-size="10.5">an agent · 2 members</text><line x1="0" x2="230" y1="72" y2="72" class="sl" stroke-width="1"/><rect x="88" y="84" width="130" height="29" rx="11" class="ta"/><text x="98" y="103" class="t" font-size="11.5">run the tests</text><rect x="12" y="126" width="206" height="40" rx="7" class="cardf"/><rect x="12" y="126" width="4" height="40" rx="2" class="btn"/><text x="25" y="143" class="t" font-size="11" font-weight="600">Working</text><text x="25" y="158" class="m" font-size="10">ran 1 command</text><rect x="12" y="174" width="206" height="40" rx="7" class="cardf"/><rect x="12" y="174" width="4" height="40" rx="2" class="g"/><text x="25" y="191" class="t" font-size="11" font-weight="600">Ran a command</text><text x="25" y="206" class="m mono" font-size="10">cargo test · exit 0</text></g></g><text x="830" y="232" class="t" font-size="12" font-weight="700">One row,</text><text x="830" y="249" class="t" font-size="12" font-weight="700">in place.</text><text x="830" y="275" class="m" font-size="11.5">Never a</text><text x="830" y="291" class="m" font-size="11.5">second row.</text><line x1="826" y1="262" x2="794" y2="262" class="arr sm" marker-end="url(#hm)"/>
</svg>
