<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc">
<title id="title">Scene 3: the agent asks permission and Alice answers</title>
<desc id="desc">Alice&#x27;s phone shows an approval card for the command rm -rf build with Allow once and Deny. Pressing Allow once sends an answer that names the agent and points at the approval item. The agent&#x27;s machine checks that Alice may approve and that the approval is still waiting, passes the answer to the harness, and edits the approval item to say Answered: Allow once, by Alice. Every member&#x27;s app shows that edit.</desc>
<style>
