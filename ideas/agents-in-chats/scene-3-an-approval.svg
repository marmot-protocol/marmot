.grp{fill:#12294a;stroke:#4493f8;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#484f58;stroke-dasharray:6 4}
}
</style>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker>
<marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="r"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g"/></marker>
<marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="460" rx="16"/>
<text x="50" y="46" class="t" font-size="14" font-weight="700">Alice&#x27;s phone</text><g transform="translate(50,58)"><rect x="0" y="0" width="250" height="370" rx="30" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="230" height="350" rx="22" class="scr"/><rect x="97.0" y="17" width="56" height="12" rx="6" class="frame"/><g transform="translate(10,10)"><text x="14" y="48" class="t" font-size="14" font-weight="700">Claude on the laptop</text><text x="14" y="63" class="m" font-size="10.5">an agent · 2 members</text><line x1="0" x2="230" y1="72" y2="72" class="sl" stroke-width="1"/><rect x="70" y="84" width="148" height="29" rx="11" class="ta"/><text x="80" y="103" class="t" font-size="11.5">clean the build folder</text><rect x="12" y="128" width="206" height="124" rx="10" class="ty"/><text x="24" y="150" class="t" font-size="12" font-weight="700">Allow this command?</text><rect x="24" y="160" width="182" height="26" rx="6" class="scr"/><text x="32" y="177" class="t mono" font-size="11">rm -rf build</text><rect x="24" y="198" width="86" height="30" rx="15" class="btn"/><text x="67" y="217" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Allow once</text><rect x="120" y="198" width="86" height="30" rx="15" class="btn2"/><text x="163" y="217" class="t" font-size="11" font-weight="600" text-anchor="middle">Deny</text><text x="24" y="244" class="y" font-size="10">waiting for you</text></g></g><text x="660" y="46" class="t" font-size="14" font-weight="700">The agent&#x27;s machine</text><rect x="660" y="58" width="250" height="370" rx="12" class="card"/><rect x="676" y="82" width="218" height="66" rx="9" class="cardf"/><circle cx="696" cy="104" r="10" class="btn"/><text x="696" y="108" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1</text><text x="714" y="108" class="t" font-size="11.5">Is this answer for me, and</text><text x="714" y="126" class="t" font-size="11.5">may Alice approve?</text><rect x="676" y="166" width="218" height="66" rx="9" class="cardf"/><circle cx="696" cy="188" r="10" class="btn"/><text x="696" y="192" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2</text><text x="714" y="192" class="t" font-size="11.5">Is the approval still waiting?</text><text x="714" y="210" class="t" font-size="11.5">The first valid answer wins.</text><rect x="676" y="250" width="218" height="66" rx="9" class="cardf"/><circle cx="696" cy="272" r="10" class="btn"/><text x="696" y="276" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">3</text><text x="714" y="276" class="t" font-size="11.5">Pass it to the harness as an</text><text x="714" y="294" class="t" font-size="11.5">answer, never as a prompt.</text><rect x="676" y="334" width="218" height="66" rx="9" class="cardf"/><circle cx="696" cy="356" r="10" class="btn"/><text x="696" y="360" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">4</text><text x="714" y="360" class="t" font-size="11.5">Edit the approval item to</text><text x="714" y="378" class="t" font-size="11.5">say what happened.</text><line x1="312" y1="180" x2="652" y2="180" class="arr sa" marker-end="url(#ha)"/><text x="482" y="150" class="a" font-size="12" font-weight="600" text-anchor="middle">an answer: “Allow once”</text><text x="482" y="167" class="m" font-size="10.5" text-anchor="middle">names the agent and points at the approval item</text><line x1="652" y1="330" x2="312" y2="330" class="arr sg" marker-end="url(#hg)"/><text x="482" y="300" class="g" font-size="12" font-weight="600" text-anchor="middle">an edit of the approval item</text><text x="482" y="317" class="m" font-size="10.5" text-anchor="middle">“Answered: Allow once, by Alice”</text><text x="482" y="372" class="m" font-size="11.5" text-anchor="middle">Every member&#x27;s app shows the edit.</text><text x="482" y="389" class="m" font-size="11.5" text-anchor="middle">Until it arrives, the press shows as pending.</text>
</svg>
