<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 596" width="960" height="596" role="img" aria-labelledby="title desc">
<title id="title">Scene 7: managing and removing devices</title>
<desc id="desc">Alice's Devices screen lists this device, her linked devices with last activity, and unrecognized sign-ins. Removing the laptop takes it out of every chat and the device group and deletes its KeyPackage slot. A timeline shows inactive devices going stale, prompting at 30 days, and being removed at 90 days unless kept.</desc>
