<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 494" width="960" height="494" role="img" aria-labelledby="title desc">
<title id="title">Scene 8: this wasn't me</title>
<desc id="desc">A full-screen warning tells Alice someone else has her key. Her devices reject the sign-in, keep it out of existing chats and history, and remove it from shared chats. The key holder can still be invited to new chats, send as Alice, remove her devices, and publish KeyPackages.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.bg{fill:#f6f8fa}
.t{fill:#1f2328} .m{fill:#59636e} .a{fill:#0969da} .d{fill:#cf222e}
.g{fill:#1a7f37} .y{fill:#9a6700} .r{fill:#8250df} .f{fill:#afb8c1}
.frame{fill:#2d333b;stroke:#2d333b} .scr{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d1d9e0} .cardf{fill:#ffffff;stroke:#d1d9e0}
.ln{fill:none;stroke:#d1d9e0} .lnf{fill:#d1d9e0}
.btn{fill:#0969da} .btn2{fill:#ffffff;stroke:#d1d9e0} .btnd{fill:#ffffff;stroke:#cf222e}
.ta{fill:#ddf4ff} .td{fill:#ffebe9} .tg{fill:#dafbe1} .ty{fill:#fff8c5} .tr{fill:#fbefff}
.sa{stroke:#0969da} .sd{stroke:#cf222e} .sg{stroke:#1a7f37} .sy{stroke:#9a6700}
.sr{stroke:#8250df} .sm{stroke:#59636e} .sf{stroke:#afb8c1} .sl{stroke:#d1d9e0}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#ddf4ff;stroke:#0969da;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#afb8c1;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){
.bg{fill:#151b23}
.t{fill:#e6edf3} .m{fill:#9198a1} .a{fill:#4493f8} .d{fill:#f85149}
.g{fill:#3fb950} .y{fill:#d29922} .r{fill:#ab7df8} .f{fill:#484f58}
.frame{fill:#2f3742;stroke:#4a535e} .scr{fill:#0d1117}
.card{fill:#151b23;stroke:#3d444d} .cardf{fill:#0d1117;stroke:#3d444d}
.ln{fill:none;stroke:#3d444d} .lnf{fill:#3d444d}
.btn{fill:#1f6feb} .btn2{fill:#0d1117;stroke:#3d444d} .btnd{fill:#0d1117;stroke:#f85149}
.ta{fill:#12294a} .td{fill:#3c1618} .tg{fill:#12261e} .ty{fill:#2e2610} .tr{fill:#2a1d45}
.sa{stroke:#4493f8} .sd{stroke:#f85149} .sg{stroke:#3fb950} .sy{stroke:#d29922}
.sr{stroke:#ab7df8} .sm{stroke:#9198a1} .sf{stroke:#484f58} .sl{stroke:#3d444d}
.arr{fill:none;stroke-width:1.75} .dash{stroke-dasharray:5 4}
.grp{fill:#12294a;stroke:#4493f8;stroke-dasharray:6 4;fill-opacity:.45}
.grpx{fill:none;stroke:#484f58;stroke-dasharray:6 4}
}
</style>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker>
<marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker>
<marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="r"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g"/></marker>
<marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="494" rx="16"/>
<g transform="translate(60,40)">
<rect x="0" y="0" width="210" height="400" rx="32" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="190" height="380" rx="24" class="scr"/><rect x="75.0" y="17" width="60" height="14" rx="7" class="frame"/><g transform="translate(10,10)">
<path d="M95,51.099999999999994 L116.0,86.8 L74.0,86.8 z" class="d"/><rect x="93.32" y="62.65" width="3.3600000000000003" height="13.65" rx="1.4" fill="#ffffff"/><circle cx="95" cy="81.025" r="2.1" fill="#ffffff"/><text x="95" y="124" class="t" font-size="17" font-weight="700" text-anchor="middle">Someone else has</text><text x="95" y="146" class="t" font-size="17" font-weight="700" text-anchor="middle">your key</text><text x="95" y="174" class="m" font-size="11.5" text-anchor="middle">Whoever made that sign-in</text>
<text x="95" y="190" class="m" font-size="11.5" text-anchor="middle">has your nsec. They can join</text>
<text x="95" y="206" class="m" font-size="11.5" text-anchor="middle">chats you’re invited to and</text>
<text x="95" y="222" class="m" font-size="11.5" text-anchor="middle">act as you.</text><rect x="12" y="246" width="166" height="44" rx="8" class="td"/><text x="95" y="264" class="d" font-size="11.5" font-weight="600" text-anchor="middle">The only full fix is moving</text>
<text x="95" y="279" class="d" font-size="11.5" font-weight="600" text-anchor="middle">to a new account.</text><rect x="12" y="302" width="166" height="30" rx="15.0" class="btn"/><text x="95.0" y="321.32" font-size="12" font-weight="600" text-anchor="middle" class="" fill="#ffffff">What can I do?</text><text x="95" y="360" class="m" font-size="12" font-weight="600" text-anchor="middle">Close</text>
</g>
</g><text x="165.0" y="464" class="m" font-size="13" font-weight="600" text-anchor="middle">Alice’s iPhone</text><rect x="320" y="60" width="300" height="234" rx="12" class="cardf"/><rect x="320" y="60" width="300" height="40" rx="12" class="tg"/><rect x="320" y="88" width="300" height="12" rx="0" class="tg"/><text x="336" y="86" class="g" font-size="13.5" font-weight="700">What Alice’s devices do</text><path d="M336,122 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="126" class="t" font-size="12">Mark the sign-in rejected, so no</text>
<text x="360" y="142" class="t" font-size="12">device prompts about it again</text><path d="M336,168 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="172" class="t" font-size="12">Never add it to her existing chats</text><path d="M336,214 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="218" class="t" font-size="12">Never send it chat history</text><path d="M336,260 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="264" class="t" font-size="12">Remove it from chats they share</text>
<text x="360" y="280" class="t" font-size="12">with it</text><rect x="640" y="60" width="290" height="234" rx="12" class="cardf"/><rect x="640" y="60" width="290" height="40" rx="12" class="td"/><rect x="640" y="88" width="290" height="12" rx="0" class="td"/><text x="656" y="86" class="d" font-size="13.5" font-weight="700">What the key holder can still do</text><circle cx="662" cy="122" r="4" class="d"/><text x="680" y="126" class="t" font-size="12">Be added to new chats that</text>
<text x="680" y="142" class="t" font-size="12">others invite Alice to</text><circle cx="662" cy="168" r="4" class="d"/><text x="680" y="172" class="t" font-size="12">Send messages as Alice</text><circle cx="662" cy="214" r="4" class="d"/><text x="680" y="218" class="t" font-size="12">Remove Alice’s own devices</text><circle cx="662" cy="260" r="4" class="d"/><text x="680" y="264" class="t" font-size="12">Publish more KeyPackages</text><text x="625" y="336" class="t" font-size="13" font-weight="600" text-anchor="middle">Approval controls Alice’s device group, not her key.</text><text x="625" y="356" class="m" font-size="12.5" text-anchor="middle">Detection is the protection here; key rotation is out of scope.</text>
</svg>
