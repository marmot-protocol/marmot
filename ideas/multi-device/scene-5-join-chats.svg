<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Scene 5: the new laptop joins Alice's chats</title>
<desc id="desc">After approval the iPhone forms a device group with the laptop, then adds the laptop to each of its chats using the laptop's single last-resort KeyPackage. The laptop shows its progress, lists chats that wait on members' app updates, and receives history afterwards.</desc>
<style>
