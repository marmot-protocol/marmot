<rect class="bg" x="0" y="0" width="960" height="540" rx="16"/>
<g transform="translate(60,56)">
<rect x="0" y="0" width="210" height="400" rx="32" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="190" height="380" rx="24" class="scr"/><rect x="75.0" y="17" width="60" height="14" rx="7" class="frame"/><g transform="translate(10,10)">
<text x="14" y="52" class="t" font-size="17" font-weight="700">Linking Laptop</text><text x="14" y="72" class="m" font-size="11.5">Adding it to your chats</text><rect x="12" y="92" width="166" height="36" rx="8" class="card"/><text x="24" y="114" class="t" font-size="12.5" font-weight="600">Hiking crew</text><path d="M154,110 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="134" width="166" height="36" rx="8" class="card"/><text x="24" y="156" class="t" font-size="12.5" font-weight="600">Family</text><path d="M154,152 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="176" width="166" height="36" rx="8" class="card"/><text x="24" y="198" class="t" font-size="12.5" font-weight="600">Book club</text><path d="M154,194 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="218" width="166" height="36" rx="8" class="card"/><text x="24" y="240" class="t" font-size="12.5" font-weight="600">Work</text><circle cx="160" cy="236" r="6" class="sl" fill="none" stroke-width="2"/><path d="M160,230 a6,6 0 0 1 6,6" class="sa" fill="none" stroke-width="2" stroke-linecap="round"/><rect x="12" y="260" width="166" height="36" rx="8" class="card"/><text x="24" y="282" class="t" font-size="12.5" font-weight="600">Old school</text><path d="M154,276 v-3 a4,4 0 0 1 8,0 v3" fill="none" class="sy" stroke-width="1.6"/><rect x="152" y="276" width="12" height="9" rx="2" class="y"/><rect x="12" y="306" width="166" height="58" rx="8" class="ty"/><text x="22" y="324" class="y" font-size="11">Old school: waiting for</text>
<text x="22" y="338" class="y" font-size="11">members to update</text>
<text x="22" y="352" class="y" font-size="11">their app</text>
</g>
</g><text x="165.0" y="480" class="m" font-size="13" font-weight="600" text-anchor="middle">Alice’s iPhone (approved)</text><g transform="translate(580,150)">
<rect x="0" y="0" width="340" height="220" rx="12" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="320" height="200" rx="5" class="scr"/><g transform="translate(10,10)">
<text x="20" y="32" class="g" font-size="16" font-weight="700">Linked</text><path d="M78,22 l4,4 l8,-9" class="sg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="54" class="t" font-size="12.5">Joining your chats</text><text x="300" y="54" class="m" font-size="12" text-anchor="end">12 of 15</text><rect x="20" y="64" width="280" height="8" rx="4" class="lnf"/><rect x="20" y="64" width="224" height="8" rx="4" class="btn"/><rect x="20" y="86" width="280" height="38" rx="8" class="ty"/><text x="32" y="101" class="y" font-size="11">3 chats need members to update their app</text>
<text x="32" y="115" class="y" font-size="11">before this laptop can join them.</text><circle cx="28" cy="146" r="6" class="sl" fill="none" stroke-width="2"/><path d="M28,140 a6,6 0 0 1 6,6" class="sa" fill="none" stroke-width="2" stroke-linecap="round"/><text x="42" y="150" class="m" font-size="12">Chat history: transferring</text><text x="20" y="180" class="m" font-size="11.5">Each chat joined → the laptop self-updates</text>
</g><path d="M-24,220 H364 l-10,13 H-14 z" class="frame" stroke-width="1.5"/><rect x="142.0" y="220" width="56" height="5" rx="2" class="lnf"/>
</g><text x="750.0" y="409" class="m" font-size="13" font-weight="600" text-anchor="middle">Alice’s new laptop</text><rect x="330" y="22" width="300" height="40" rx="20" class="grp"/><text x="480" y="47" class="a" font-size="13" font-weight="700" text-anchor="middle">Device group: iPhone · Laptop</text><circle cx="318" cy="42" r="10.5" class="a"/><text x="318" y="46.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><path d="M282,196 C390,196 470,226 556,226" class="arr sa" marker-end="url(#ha)"/><path d="M282,236 C390,236 470,246 556,246" class="arr sa" marker-end="url(#ha)"/><path d="M282,276 C390,276 470,266 556,266" class="arr sa" marker-end="url(#ha)"/><rect x="330" y="132" width="230" height="50" rx="6" class="bg"/><circle cx="338" cy="146" r="10.5" class="a"/><text x="338" y="150.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="356" y="151" class="t" font-size="12.5" font-weight="600">one Welcome per chat</text><text x="356" y="169" class="m" font-size="11.5">all to the laptop’s one KeyPackage</text><rect x="356" y="316" width="196" height="40" rx="6" class="bg"/><circle cx="364" cy="330" r="10.5" class="a"/><text x="364" y="334.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="382" y="335" class="m" font-size="11.5">last-resort KeyPackage,</text><text x="382" y="351" class="m" font-size="11.5">so it can be reused</text><text x="480" y="518" class="m" font-size="13" text-anchor="middle">The approving device does the adding: it is online and in Alice’s hand. Chats it isn’t in are covered by gap filling.</text>
</svg>
