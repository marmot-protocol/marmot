<circle cx="422" cy="67" r="3" class="r"/><circle cx="432" cy="67" r="3" class="r" fill-opacity=".5"/>
<rect x="472" y="65" width="28" height="4" rx="2" class="r" fill-opacity=".45"/>
<rect x="410" y="82" width="100" height="22" rx="6" class="tr" stroke-width="1.2"/><rect x="410" y="82" width="100" height="22" rx="6" class="sr" fill="none"/>
<circle cx="422" cy="93" r="3" class="r"/><circle cx="432" cy="93" r="3" class="r" fill-opacity=".5"/>
<rect x="472" y="91" width="28" height="4" rx="2" class="r" fill-opacity=".45"/>
<text x="460.0" y="126" class="r" font-size="13" font-weight="700" text-anchor="middle">Relays</text><path d="M760,110 V58 H522" class="arr sa" marker-end="url(#ha)"/><circle cx="560" cy="36" r="10.5" class="a"/><text x="560" y="40.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="578" y="41" class="t" font-size="12.5" font-weight="600">KeyPackage in slot B</text><path d="M398,58 H282" class="arr sa" marker-end="url(#ha)"/><circle cx="300" cy="36" r="10.5" class="a"/><text x="300" y="40.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="318" y="41" class="t" font-size="12.5" font-weight="600">noticed</text><text x="300" y="80" class="m" font-size="11.5">slot B is not</text><text x="300" y="95" class="m" font-size="11.5">in the roster</text><path d="M250,210 C360,210 520,236 626,236" class="arr sa dash" marker-start="url(#ha)" marker-end="url(#ha)"/><rect x="376" y="186" width="170" height="20" rx="6" class="bg"/><circle cx="392" cy="196" r="10.5" class="a"/><text x="392" y="200.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="410" y="201" class="t" font-size="12.5" font-weight="600">Alice confirms on both</text><text x="480" y="494" class="m" font-size="13" text-anchor="middle">Approving on any one device is enough. Her other devices change their prompt to “Laptop was added by iPhone.”</text>
