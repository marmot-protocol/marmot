<text x="14" y="50" class="t" font-size="18" font-weight="700">New sign-in</text><rect x="12" y="60" width="166" height="44" rx="10" class="card"/><text x="24" y="79" class="t" font-size="12" font-weight="600">White Noise</text><text x="24" y="95" class="m" font-size="11">appeared just now</text><text x="14" y="124" class="m" font-size="11">Code on the new device</text><rect x="12" y="130" width="166" height="32" rx="8" class="ta"/><text x="95.0" y="149.96" class="a mono" font-size="11" font-weight="600" text-anchor="middle">river  apple  seven  moon</text><text x="14" y="180" class="m" font-size="11">Name this device</text><rect x="12" y="186" width="166" height="28" rx="7" class="cardf"/><text x="22" y="205" class="t" font-size="12.5">Laptop</text><line x1="66" x2="66" y1="192" y2="208" class="sa" stroke-width="1.5"/><text x="14" y="235" class="t" font-size="11.5">Add to all my chats</text><rect x="142" y="224" width="34" height="18" rx="9" class="btn"/><circle cx="167" cy="233" r="7" fill="#ffffff"/><text x="14" y="261" class="t" font-size="11.5">Bring chat history</text><rect x="142" y="250" width="34" height="18" rx="9" class="btn"/><circle cx="167" cy="259" r="7" fill="#ffffff"/><rect x="12" y="282" width="166" height="30" rx="15.0" class="btn"/><text x="95.0" y="301.32" font-size="12" font-weight="600" text-anchor="middle" class="" fill="#ffffff">Link device</text><rect x="12" y="318" width="166" height="28" rx="14.0" class="btnd"/><text x="95.0" y="336.32" font-size="12" font-weight="600" text-anchor="middle" class="d">This wasn’t me</text><text x="95" y="366" class="m" font-size="12" font-weight="600" text-anchor="middle">Not now</text>
</g>
</g><text x="165.0" y="464" class="m" font-size="13" font-weight="600" text-anchor="middle">Alice’s iPhone</text><g transform="translate(600,118)">
<rect x="0" y="0" width="340" height="220" rx="12" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="320" height="200" rx="5" class="scr"/><g transform="translate(10,10)">
<text x="20" y="34" class="t" font-size="15" font-weight="700">Check your other device</text><text x="20" y="60" class="m" font-size="12">Your other device answered. Check that</text>
<text x="20" y="77" class="m" font-size="12">it shows the same four words:</text><rect x="20" y="96" width="280" height="40" rx="8" class="ta"/><text x="160.0" y="121.4" class="a mono" font-size="15" font-weight="600" text-anchor="middle">river  apple  seven  moon</text><rect x="20" y="152" width="280" height="28" rx="14.0" class="btn"/><text x="160.0" y="170.32" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">They match</text>
</g><path d="M-24,220 H364 l-10,13 H-14 z" class="frame" stroke-width="1.5"/><rect x="142.0" y="220" width="56" height="5" rx="2" class="lnf"/>
