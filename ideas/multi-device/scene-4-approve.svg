<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="960" height="516" role="img" aria-labelledby="title desc">
<title id="title">Scene 4: an existing device approves the new sign-in</title>
<desc id="desc">Alice's iPhone notices a KeyPackage in a slot outside its roster and shows a New sign-in prompt with the client name, the same four-word code shown on the laptop, a field to name the device, two toggles, and Link, This wasn't me, and Not now. The laptop shows the same words and a They match button; Alice confirms on both.</desc>
<style>
