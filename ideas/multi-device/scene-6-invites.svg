<text x="20" y="32" class="t" font-size="15" font-weight="700">Hiking crew</text><line x1="20" x2="300" y1="44" y2="44" class="ln"/><rect x="60" y="58" width="200" height="24" rx="12" class="card"/><text x="160" y="74" class="m" font-size="11" text-anchor="middle">You joined · accepted on iPhone</text><circle cx="34" cy="112" r="12" class="ta"/><text x="34" y="116.56" class="a" font-size="12.0" font-weight="700" text-anchor="middle">B</text><rect x="52" y="98" width="150" height="30" rx="12" class="card"/><text x="64" y="118" class="t" font-size="12">Saturday at 8?</text>
</g><path d="M-24,220 H364 l-10,13 H-14 z" class="frame" stroke-width="1.5"/><rect x="142.0" y="220" width="56" height="5" rx="2" class="lnf"/>
</g><text x="822.6" y="469.74" class="m" font-size="13" font-weight="600" text-anchor="middle">Alice’s laptop</text><path d="M472,64 C520,64 535,80 535,104" class="arr sa" marker-end="url(#ha)"/><path d="M472,76 C760,76 900,120 900,250" class="arr sa" marker-end="url(#ha)"/><path d="M634,330 C660,330 670,350 696,350" class="arr sa dash" marker-end="url(#ha)"/><circle cx="700" cy="226" r="10.5" class="a"/><text x="700" y="230.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="718" y="231" class="t" font-size="12.5" font-weight="600">decision shared</text><text x="718" y="247" class="t" font-size="12.5" font-weight="600">in the device group</text><text x="480" y="540" class="m" font-size="13" text-anchor="middle">Accept on any device and the others follow. Decline works the same way, except every device leaves the chat.</text>
</svg>
