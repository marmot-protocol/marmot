<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562" width="960" height="562" role="img" aria-labelledby="title desc">
<title id="title">Scene 6: everyday invites</title>
<desc id="desc">Bob invites Alice. His client sends one Welcome for each of Alice's fresh devices. Alice accepts on her iPhone, and the decision is shared through the device group so her laptop joins too. Bob sees Alice as one member with two devices.</desc>
<style>
