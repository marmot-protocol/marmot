<circle cx="372" cy="103" r="3" class="r"/><circle cx="382" cy="103" r="3" class="r" fill-opacity=".5"/>
<rect x="422" y="101" width="28" height="4" rx="2" class="r" fill-opacity=".45"/>
<text x="410.0" y="136" class="r" font-size="13" font-weight="700" text-anchor="middle">Relays</text><path d="M122,90 V58 H348" class="arr sa" marker-end="url(#ha)"/><circle cx="146" cy="36" r="10.5" class="a"/><text x="146" y="40.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="164" y="41" class="t" font-size="12.5" font-weight="600">one Welcome per fresh device</text><g transform="translate(440,116) scale(0.9)">
<rect x="0" y="0" width="210" height="400" rx="32" class="frame" stroke-width="1.5"/><rect x="10" y="10" width="190" height="380" rx="24" class="scr"/><rect x="75.0" y="17" width="60" height="14" rx="7" class="frame"/><g transform="translate(10,10)">
<text x="95" y="66" class="m" font-size="12" text-anchor="middle">Bob invited you to</text><circle cx="95" cy="108" r="24" class="ta"/><text x="95" y="117.12" class="a" font-size="24.0" font-weight="700" text-anchor="middle">H</text><text x="95" y="156" class="t" font-size="16" font-weight="700" text-anchor="middle">Hiking crew</text><text x="95" y="176" class="m" font-size="11.5" text-anchor="middle">3 members</text><rect x="20" y="204" width="150" height="32" rx="10" class="btn"/><text x="95.0" y="224.32" font-size="12" font-weight="600" text-anchor="middle" class="" fill="#ffffff">Accept</text><rect x="20" y="246" width="150" height="30" rx="15.0" class="btn2"/><text x="95.0" y="265.32" font-size="12" font-weight="600" text-anchor="middle" class="t">Decline</text><circle cx="120" cy="222" r="14" class="a" fill-opacity=".25"/>
</g>
</g><text x="534.5" y="500.0" class="m" font-size="13" font-weight="600" text-anchor="middle">Alice’s iPhone</text><circle cx="450" cy="324" r="10.5" class="a"/><text x="450" y="328.2" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><g transform="translate(690,262) scale(0.78)">
